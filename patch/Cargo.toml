[package]
name = "taxipatch"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
game = { path = "../game" }

windows.workspace = true
retour.workspace = true
inventory.workspace = true

anyhow = "1.0.102"
config = { version = "0.15.22", features = ["ini"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
hex = "0.4.3"
winapi = { version = "0.3.9", features = ["consoleapi"] }
