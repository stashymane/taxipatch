[workspace]
resolver = "3"
members = ["patch", "game"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
retour = { version = "0.4.0-alpha.4", features = ["nightly", "thiscall-abi", "static-detour"] }
retour-utils = {
    git = "https://github.com/stashymane/retour-utils.git",
    rev = "df9fe7953b2c1544dc163d6accb49dbb7b72e03e"
}

windows = {
    version = "0.62.2",
    features = [
        "Win32_Foundation",
        "Win32_UI_WindowsAndMessaging",
        "Win32_Graphics_Gdi",
        "Win32_Graphics_Direct3D9",
        "Win32_System_SystemServices",
        "Win32_System_Diagnostics_Debug",
        "Win32_System_LibraryLoader",
        "Win32_System_Memory",
        "Win32_System_Threading"
    ]
}
thiserror = "2.0.18"
inventory = "0.3.24"
