[package]
name = "taxipatch"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

thiserror = "2.0.18"
anyhow = "1.0.102"
config = { version = "0.15.22", features = ["ini"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }

retour = { version = "0.4.0-alpha.4", features = ["nightly", "thiscall-abi", "static-detour"] }
