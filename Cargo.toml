[workspace]
resolver = "3"
members = ["game"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
retour = { version = "0.4.0-alpha.4", features = ["nightly", "thiscall-abi", "static-detour"] }
windows = {
    version = "0.62.2",
    features = [
        "Win32_Foundation",
        "Win32_UI_WindowsAndMessaging",
        "Win32_Graphics_Gdi",
        "Win32_Graphics_Direct3D9",
        "Win32_System_SystemServices",
        "Win32_System_Diagnostics_Debug",
        "Win32_System_LibraryLoader",
        "Win32_System_Memory",
        "Win32_System_Threading"
    ]
}

[package]
name = "taxipatch"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
game = { path = "game" }

windows.workspace = true
retour.workspace = true

inventory = "0.3.24"
anyhow = "1.0.102"
config = { version = "0.15.22", features = ["ini"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
hex = "0.4.3"
